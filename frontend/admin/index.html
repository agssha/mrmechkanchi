<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Mr. Mech Kanchi</title>
    <meta name="robots" content="noindex, nofollow" />

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 320px;
            max-width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h2 {
            margin-bottom: 20px;
            text-align: center;
            color: #2563eb;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box; /* ✅ Fixes layout alignment issues caused by padding */
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            color: red;
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>Admin Login</h2>

        <input type="text" id="phone" placeholder="Phone Number">
        <input type="password" id="password" placeholder="Password">

        <button onclick="loginAdmin(this)">Login</button>

        <p class="error" id="error"></p>
    </div>

    <script>
        // Dynamic CSS spinner injection and setButtonLoading helper function
        (function() {
            const style = document.createElement('style');
            style.textContent = `
            @keyframes button-spin {
              to { transform: rotate(360deg); }
            }
            .button-spinner {
              display: inline-block;
              width: 1rem;
              height: 1rem;
              border: 2px solid currentColor;
              border-right-color: transparent;
              border-radius: 50%;
              animation: button-spin 0.75s linear infinite;
              margin-right: 0.5rem;
              vertical-align: text-bottom;
            }
            `;
            document.head.appendChild(style);

            window.setButtonLoading = function(btn, isLoading, loadingText) {
                if (!btn) return;
                if (isLoading) {
                    btn.disabled = true;
                    btn.style.pointerEvents = 'none';
                    btn.style.opacity = '0.7';
                    btn.dataset.originalHtml = btn.innerHTML;
                    btn.innerHTML = `<span class="button-spinner"></span>` + (loadingText || 'Please Wait...');
                } else {
                    btn.disabled = false;
                    btn.style.pointerEvents = '';
                    btn.style.opacity = '';
                    if (btn.dataset.originalHtml !== undefined) {
                        btn.innerHTML = btn.dataset.originalHtml;
                    }
                }
            };
        })();

        // 🔥 UPDATED: Base API URL
        const API = "https://mrmechkanchi-1.onrender.com";


        async function loginAdmin(btn) {
            const phone = document.getElementById("phone").value.trim();
            const password = document.getElementById("password").value;
            const error = document.getElementById("error");

            error.innerText = "";

            if (!phone || !password) {
                error.innerText = "All fields required";
                return;
            }

            setButtonLoading(btn, true, "Logging In... Please Wait");

            try {
                // ✅ Sends request to https://mrmechkanchi-1.onrender.com/auth/admin-login
                const res = await fetch(`${API}/api/auth/admin-login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ phone, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    error.innerText = data.message || "Login failed";
                    setButtonLoading(btn, false);
                    return;
                }

                // ✅ SAVE SEGREGATED STORAGE VALUES
                localStorage.setItem("token", data.token);   
                localStorage.setItem("role", "admin"); // Helpful flag to check role client-side

                // Relocate screen straight into your admin panel dashboard view
                window.location.href = "/dashboard";

            } catch (err) {
                error.innerText = "Server not reachable. Is your API running?";
                setButtonLoading(btn, false);
            }
        }
    </script>

</body>
</html>
